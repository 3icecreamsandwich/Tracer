name: Tracer web checks and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: preview
        options: [preview, production]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_fixture
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Unit tests
        shell: bash
        run: |
          mkdir -p test-results/unit
          set -o pipefail
          bun x vitest run 2>&1 | tee test-results/unit/vitest.log
      - run: bun run build:cloudflare
      - run: bun x wrangler deploy --config .wrangler/tracer.json --dry-run
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:e2e:cloudflare
      - run: TRACER_BUILD_DIR=.nuxt-desktop-check bun --bun run generate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-output
          path: test-results/
  release:
    if: github.ref == 'refs/heads/main' && github.repository == '3icecreamsandwich/tracer' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'production' || inputs.target }}
    concurrency:
      group: tracer-web-${{ github.event_name == 'push' && 'production' || inputs.target }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_GITHUB_OAUTH_CLIENT_ID: ${{ vars.VITE_GITHUB_OAUTH_CLIENT_ID }}
      NUXT_WEB_AI_COMPATIBLE_ORIGIN: ${{ vars.NUXT_WEB_AI_COMPATIBLE_ORIGIN }}
      RELEASE_TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Check release credentials
        run: test -n "$CLOUDFLARE_API_TOKEN"
      - run: bun run build:cloudflare
      - name: Deploy tested commit
        shell: bash
        run: |
          set -o pipefail
          if [ "$RELEASE_TARGET" = production ]; then
            bun run deploy:cloudflare:production 2>&1 | tee release.log
          else
            bun run deploy:cloudflare:preview 2>&1 | tee release.log
          fi
          printf 'Commit: `%s`\nTarget: `%s`\n' "$GITHUB_SHA" "$RELEASE_TARGET" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Current Version ID:/p' release.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.target }}-${{ github.sha }}
          path: release.log
