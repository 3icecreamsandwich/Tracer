name: Build Linux Installer

on:
  workflow_dispatch:

jobs:
  build-linux-installer:
    runs-on: ubuntu-22.04
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Supabase build configuration
        run: >-
          node -e "const required = ['VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY']; const missing = required.filter((name) => !process.env[name]); if (missing.length) { console.error('Missing GitHub Actions variables: ' + missing.join(', ')); process.exit(1); }"

      - name: Build Tauri Linux installer
        run: bun run tauri build --bundles deb appimage

      - name: Upload DEB installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracer-linux-deb-installer
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracer-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
