name: Build Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to rebuild
        required: true
        type: string
      platform:
        description: Platforms to rebuild
        type: choice
        options: [macos, all]
        default: macos
      published:
        description: The existing release is already published
        type: boolean
        default: false
      verify_only:
        description: Verify existing macOS updater assets without rebuilding
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '3icecreamsandwich/tracer'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      # Serialize uploads so latest.json updates cannot race.
      max-parallel: 1
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.platform == 'macos' && '["macos-latest"]' || '["macos-latest","windows-latest","ubuntu-22.04"]') }}

    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Setup Bun
        if: inputs.verify_only != true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        if: inputs.verify_only != true
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && inputs.verify_only != true
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            xdg-utils

      - name: Install frontend dependencies
        if: inputs.verify_only != true
        run: bun install --frozen-lockfile

      - name: Validate release configuration
        id: release_config
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const config = JSON.parse(
            fs.readFileSync('src-tauri/tauri.conf.json', 'utf8')
          );

          const expectedTag = `v${config.version}`;

          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `Tag must be ${expectedTag}, received ${process.env.RELEASE_TAG}`
            );
          }

          for (const name of [
            'TAURI_SIGNING_PRIVATE_KEY',
            'VITE_SUPABASE_URL',
            'VITE_SUPABASE_PUBLISHABLE_KEY',
          ]) {
            if (!process.env[name]) {
              throw new Error(`Missing build configuration: ${name}`);
            }
          }

          if (config.bundle?.createUpdaterArtifacts !== true) {
            throw new Error('bundle.createUpdaterArtifacts must be true');
          }
          const prerelease = config.version.includes('-');
          const endpoint = prerelease
            ? 'https://github.com/3icecreamsandwich/Tracer/releases/download/updater-beta/latest.json'
            : 'https://github.com/3icecreamsandwich/Tracer/releases/latest/download/latest.json';
          fs.writeFileSync('src-tauri/tauri.release.generated.json', JSON.stringify({
            plugins: { updater: { endpoints: [endpoint] } }
          }));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `prerelease=${prerelease}\n`);
          NODE

      - name: Build and upload signed release
        if: inputs.verify_only != true
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin --bundles app,dmg' || matrix.os == 'windows-latest' && '--bundles nsis' || '--bundles deb,appimage' }} --config src-tauri/tauri.release.generated.json
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Tracer v__VERSION__
          releaseBody: Download the installer for your operating system.
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || !inputs.published }}
          prerelease: ${{ steps.release_config.outputs.prerelease == 'true' }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      - name: Verify macOS updater manifest
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json --dir "$RUNNER_TEMP/updater-manifest" --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets > "$RUNNER_TEMP/updater-manifest/assets.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const manifest = JSON.parse(fs.readFileSync(
            path.join(process.env.RUNNER_TEMP, 'updater-manifest/latest.json'), 'utf8'
          ));
          const { assets } = JSON.parse(fs.readFileSync(
            path.join(process.env.RUNNER_TEMP, 'updater-manifest/assets.json'), 'utf8'
          ));
          for (const arch of ['aarch64', 'x86_64']) {
            const entry = manifest.platforms?.[`darwin-${arch}-app`]
              ?? manifest.platforms?.[`darwin-${arch}`];
            const asset = assets.find(asset =>
              asset.apiUrl === entry?.url || asset.url === entry?.url
            );
            if (!entry?.signature?.trim() || !asset?.name.endsWith('.app.tar.gz')
              || !assets.some(candidate => candidate.name === `${asset.name}.sig`)) {
              throw new Error(`Missing signed macOS updater archive for ${arch}`);
            }
          }
          console.log('Signed updater archives are listed for both Mac architectures.');
          NODE
