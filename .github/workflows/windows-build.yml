name: Build Windows Installer

on:
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Supabase build configuration
        run: >-
          node -e "const required = ['VITE_SUPABASE_URL', 'VITE_SUPABASE_PUBLISHABLE_KEY']; const missing = required.filter((name) => !process.env[name]); if (missing.length) { console.error('Missing GitHub Actions variables: ' + missing.join(', ')); process.exit(1); }"

      - name: Build Tauri Windows installer
        run: bun run tauri build --bundles nsis

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracer-alpha
          path: src-tauri/target/release/bundle/nsis/*setup*.exe
          if-no-files-found: error
